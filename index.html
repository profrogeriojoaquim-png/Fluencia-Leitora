<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Saci Sabido - Fluência Leitora</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 40px;
            padding: 24px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.2s ease;
        }
        button:hover { background: #4f46e5; transform: scale(1.02); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .hidden { display: none; }
        .texto-leitura {
            background: #f1f5f9;
            border-radius: 20px;
            padding: 20px;
            font-size: 20px;
            line-height: 1.6;
            text-align: left;
            margin: 20px 0;
            font-family: 'Georgia', serif;
            max-height: 300px;
            overflow-y: auto;
        }
        .timer {
            font-size: 48px;
            font-weight: bold;
            font-family: monospace;
            background: #1e293b;
            color: white;
            padding: 10px 20px;
            border-radius: 60px;
            display: inline-block;
            margin: 10px 0;
        }
        .resultado-card {
            background: #eef2ff;
            padding: 20px;
            border-radius: 30px;
            margin: 20px 0;
        }
        .resultado-card h3 { color: #1e3c72; margin-bottom: 15px; }
        .resultado-valor { font-size: 36px; font-weight: bold; color: #6366f1; }
        .info-sesi { background: #fef9c3; border-radius: 20px; padding: 10px; font-size: 12px; color: #854d0e; margin-bottom: 15px; }
        .erro-acesso { text-align: center; padding: 50px; background: white; border-radius: 40px; max-width: 500px; margin: 20px auto; }
        .erro-acesso h2 { color: #e53e3e; margin-bottom: 20px; }
        .palavra { display: inline-block; margin: 2px; padding: 2px 4px; border-radius: 4px; transition: all 0.2s; }
        .palavra-correta { background: #bbf7d0; color: #166534; }
        .palavra-errada { background: #fee2e2; color: #991b1b; text-decoration: underline; }
        .btn-gravando {
            background: #ef4444;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .status-microfone {
            font-size: 14px;
            margin-top: 10px;
            padding: 8px;
            border-radius: 20px;
        }
        .status-ok { background: #bbf7d0; color: #166534; }
        .status-erro { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://qmcqffnawtfaenyziwsn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtY3FmZm5hd3RmYWVueXppd3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNTM5NTMsImV4cCI6MjA4OTcyOTk1M30._CjaNoeJeQp-8s8Jt-dk3bJfktdEV97R5LhLnWgYrNc';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const jogoSlug = urlParams.get('jogo_slug');
    const alunoId = urlParams.get('aluno_id');
    const turmaId = urlParams.get('turma_id');
    const escolaId = urlParams.get('escola_id');
    const modoTeste = urlParams.get('modo_teste') === 'true';

    let jogoAtivo = false;
    let jogoId = null;
    let startTime = null;
    let timerInterval = null;
    let recognition = null;
    let transcricaoFinal = "";
    let palavrasReconhecidas = [];

    const textoParaLer = "O pequeno Saci Sabido encontrou um mistério na mata. Ele usou sua inteligência para resolver o problema sem usar o cachimbo, apenas com sabedoria e envolvimento.";
    const palavrasTexto = textoParaLer.toLowerCase().split(' ');

    function iniciarReconhecimento() {
        const btn = document.getElementById('btnIniciarLeitura');
        btn.disabled = true;
        btn.textContent = '🎤 Gravando... Leia em voz alta';
        btn.classList.add('btn-gravando');
        
        document.getElementById('statusMicrofone').innerHTML = '🎤 Microfone ativo - Comece a ler...';
        document.getElementById('statusMicrofone').className = 'status-microfone status-ok';
        
        startTime = Date.now();
        transcricaoFinal = "";
        palavrasReconhecidas = [];
        
        timerInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('timerDisplay').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (elapsed >= 120) {
                pararReconhecimento();
                alert('⏰ Tempo limite de 2 minutos atingido.');
            }
        }, 1000);
        
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = true;
            recognition.interimResults = true;
            
            recognition.onresult = (event) => {
                let interimText = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        transcricaoFinal += event.results[i][0].transcript + " ";
                    } else {
                        interimText += event.results[i][0].transcript;
                    }
                }
                
                // Feedback visual em tempo real
                const palavrasLidas = transcricaoFinal.toLowerCase().split(' ');
                atualizarFeedbackVisual(palavrasLidas);
                
                document.getElementById('statusMicrofone').innerHTML = '🎤 Leitura em andamento...';
            };
            
            recognition.onerror = (event) => {
                console.error('Erro no reconhecimento:', event.error);
                if (event.error === 'not-allowed') {
                    document.getElementById('statusMicrofone').innerHTML = '❌ Permissão do microfone negada. Clique no botão "Permitir" no navegador.';
                } else if (event.error === 'no-speech') {
                    document.getElementById('statusMicrofone').innerHTML = '⚠️ Nenhum discurso detectado. Fale mais alto ou verifique seu microfone.';
                } else {
                    document.getElementById('statusMicrofone').innerHTML = '❌ Erro: ' + event.error;
                }
                document.getElementById('statusMicrofone').className = 'status-microfone status-erro';
            };
            
            recognition.onend = () => {
                if (document.getElementById('telaLeitura') && !document.getElementById('telaLeitura').classList.contains('hidden')) {
                    pararReconhecimento();
                }
            };
            
            recognition.start();
        } else {
            alert('Seu navegador não suporta reconhecimento de voz. Use Google Chrome ou Microsoft Edge.');
            reiniciarJogo();
        }
    }
    
    function atualizarFeedbackVisual(palavrasLidas) {
        const container = document.getElementById('textoComPalavras');
        if (!container) return;
        
        let html = '';
        palavrasTexto.forEach((palavra, idx) => {
            const foiLida = palavrasLidas.includes(palavra.replace(/[.,!?;]/g, ''));
            const classe = foiLida ? 'palavra-correta' : '';
            html += `<span class="palavra ${classe}">${textoParaLer.split(' ')[idx]}</span> `;
        });
        container.innerHTML = html;
    }

    function pararReconhecimento() {
        if (timerInterval) clearInterval(timerInterval);
        if (recognition) {
            try { recognition.stop(); } catch(e) {}
        }
        
        const tempoTotal = Math.floor((Date.now() - startTime) / 1000);
        const palavrasLidas = transcricaoFinal.toLowerCase().split(' ');
        
        let acertos = 0;
        const palavrasErradas = [];
        
        palavrasTexto.forEach((palavra, idx) => {
            const palavraLimpa = palavra.replace(/[.,!?;]/g, '');
            if (palavrasLidas.includes(palavraLimpa)) {
                acertos++;
            } else {
                if (!palavrasErradas.includes(palavra)) {
                    palavrasErradas.push(textoParaLer.split(' ')[idx]);
                }
            }
        });
        
        const ppm = Math.round((acertos / tempoTotal) * 60);
        const precisao = Math.round((acertos / palavrasTexto.length) * 100);
        
        let nivel = '';
        if (precisao >= 85 && ppm >= 100) nivel = '🔵 Avançado';
        else if (precisao >= 70 && ppm >= 70) nivel = '🟢 Proficiente';
        else if (precisao >= 50 && ppm >= 40) nivel = '🟡 Em desenvolvimento';
        else nivel = '🔴 Inicial';
        
        document.getElementById('resultadoVelocidade').textContent = `${ppm} palavras/minuto`;
        document.getElementById('resultadoPrecisao').textContent = `${precisao}% de acertos`;
        document.getElementById('resultadoTempo').textContent = `${tempoTotal} segundos`;
        document.getElementById('resultadoNivel').textContent = nivel;
        
        // Mostrar palavras difíceis
        if (palavrasErradas.length > 0) {
            const divPalavras = document.getElementById('palavrasDificeis');
            divPalavras.innerHTML = `<strong>📖 Palavras para praticar:</strong><br>${palavrasErradas.slice(0, 10).join(', ')}`;
            divPalavras.classList.remove('hidden');
        }
        
        document.getElementById('telaLeitura').classList.add('hidden');
        document.getElementById('telaResultado').classList.remove('hidden');
        
        salvarResultado(ppm, precisao, tempoTotal, nivel, acertos, palavrasTexto.length - acertos, palavrasErradas);
    }

    async function salvarResultado(ppm, precisao, tempo, nivel, acertos, erros, palavrasDificeis) {
        if (modoTeste || !alunoId) return;
        
        const dados = {
            aluno_id: alunoId,
            jogo_id: jogoId,
            turma_id: turmaId,
            ppm: ppm,
            nivel_proficiencia: nivel,
            texto_avaliacao: textoParaLer,
            transcricao_aluno: transcricaoFinal.substring(0, 800),
            tempo_segundos: tempo,
            acertos: acertos,
            erros: erros,
            total_questoes: palavrasTexto.length,
            habilidade_bncc: 'EF35LP09',
            tipo_atividade: 'fluencia_leitora'
        };
        
        const { error } = await supabaseClient.from('resultados').insert([dados]);
        const msgDiv = document.getElementById('msgSalvo');
        if (msgDiv) {
            if (error) {
                msgDiv.innerHTML = `❌ Erro ao salvar: ${error.message}`;
                msgDiv.style.color = '#e53e3e';
            } else {
                msgDiv.innerHTML = '✅ Resultado salvo com sucesso!';
                msgDiv.style.color = '#10b981';
            }
        }
    }

    function reiniciarJogo() {
        if (timerInterval) clearInterval(timerInterval);
        if (recognition) {
            try { recognition.stop(); } catch(e) {}
        }
        document.getElementById('btnIniciarLeitura').disabled = false;
        document.getElementById('btnIniciarLeitura').textContent = '🎤 INICIAR LEITURA';
        document.getElementById('btnIniciarLeitura').classList.remove('btn-gravando');
        document.getElementById('timerDisplay').textContent = '00:00';
        document.getElementById('statusMicrofone').innerHTML = '';
    }

    async function iniciarJogo() {
        jogoAtivo = true;
        document.getElementById('telaInicial').classList.add('hidden');
        document.getElementById('telaLeitura').classList.remove('hidden');
        
        // Solicitar permissão do microfone antes de começar
        try {
            await navigator.mediaDevices.getUserMedia({ audio: true });
            document.getElementById('btnIniciarLeitura').onclick = iniciarReconhecimento;
        } catch(err) {
            alert('❌ É necessário permitir o acesso ao microfone para realizar a leitura. Clique no ícone de cadeado na barra de endereço e permita o microfone.');
            reiniciarJogo();
        }
    }

    async function verificarAcesso() {
        if (modoTeste) return true;
        if (!jogoSlug || !turmaId) {
            mostrarErro('❌ Link inválido. Faltam parâmetros.');
            return false;
        }
        
        try {
            const { data: jogo } = await supabaseClient
                .from('jogos')
                .select('id')
                .eq('slug', jogoSlug)
                .single();
            
            if (!jogo) { mostrarErro('❌ Jogo não encontrado.'); return false; }
            jogoId = jogo.id;
            
            const { data: atribuicao } = await supabaseClient
                .from('jogos_turma')
                .select('status')
                .eq('turma_id', turmaId)
                .eq('jogo_id', jogoId);
            
            if (!atribuicao || atribuicao.length === 0) {
                mostrarErro('❌ Este jogo não foi atribuído à sua turma.');
                return false;
            }
            
            if (atribuicao[0].status === 'inativo') {
                mostrarErro('❌ Este jogo está bloqueado pelo professor.');
                return false;
            }
            
            return true;
        } catch(e) { mostrarErro('Erro ao verificar acesso.'); return false; }
    }

    function mostrarErro(mensagem) {
        document.getElementById('app').innerHTML = `
            <div class="erro-acesso"><h2>⛔ Acesso Negado</h2><p>${mensagem}</p><button onclick="window.history.back()">Voltar</button></div>
        `;
    }

    async function carregarJogo() {
        const acesso = await verificarAcesso();
        if (!acesso && !modoTeste) return;
        
        document.getElementById('app').innerHTML = `
            <div class="container">
                <div id="telaInicial">
                    <h1>📖 Fluência Leitora</h1>
                    <p>Leia o texto em voz alta com clareza</p>
                    <div class="info-sesi">📚 Habilidade: EF35LP09 - Ler com fluência e precisão</div>
                    <div class="texto-leitura">${textoParaLer}</div>
                    <button id="btnComecar">🚀 COMEÇAR</button>
                    <div class="mt-2" style="font-size:12px;">${modoTeste ? '🔧 Modo teste' : '✅ Conectado'}</div>
                </div>
                
                <div id="telaLeitura" class="hidden">
                    <h2>🎤 Leia em voz alta</h2>
                    <div class="timer" id="timerDisplay">00:00</div>
                    <div class="texto-leitura" id="textoComPalavras">
                        ${textoParaLer.split(' ').map(p => `<span class="palavra">${p}</span>`).join(' ')}
                    </div>
                    <div id="statusMicrofone" class="status-microfone"></div>
                    <button id="btnIniciarLeitura">🎤 INICIAR LEITURA</button>
                    <button id="btnCancelar" style="background:#ef4444;">❌ CANCELAR</button>
                </div>
                
                <div id="telaResultado" class="hidden">
                    <h1>📊 Resultado da Proficiência</h1>
                    <div class="resultado-card">
                        <h3>⏱️ Velocidade</h3>
                        <div class="resultado-valor" id="resultadoVelocidade">0 palavras/minuto</div>
                        <h3>🎯 Precisão</h3>
                        <div class="resultado-valor" id="resultadoPrecisao">0% de acertos</div>
                        <h3>⏰ Tempo total</h3>
                        <div class="resultado-valor" id="resultadoTempo">0 segundos</div>
                        <h3>📝 Nível</h3>
                        <div class="resultado-valor" id="resultadoNivel">--</div>
                        <div id="palavrasDificeis" class="hidden" style="margin-top:15px; padding:10px; background:#fef9c3; border-radius:15px;"></div>
                    </div>
                    <div id="msgSalvo" class="text-sm mt-2"></div>
                    <button id="btnNovamente">🔄 LER NOVAMENTE</button>
                </div>
            </div>
        `;
        
        document.getElementById('btnComecar').onclick = iniciarJogo;
        document.getElementById('btnCancelar').onclick = () => {
            reiniciarJogo();
            document.getElementById('telaLeitura').classList.add('hidden');
            document.getElementById('telaInicial').classList.remove('hidden');
        };
        document.getElementById('btnNovamente').onclick = () => {
            document.getElementById('telaResultado').classList.add('hidden');
            document.getElementById('telaInicial').classList.remove('hidden');
            reiniciarJogo();
        };
    }
    
    carregarJogo();
</script>
</body>
</html>
