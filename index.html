<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Saci Sabido - Fluência Leitora</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 40px;
            padding: 24px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #4f46e5; }
        .hidden { display: none; }
        .texto-leitura {
            background: #f1f5f9;
            border-radius: 20px;
            padding: 20px;
            font-size: 18px;
            line-height: 1.6;
            text-align: left;
            margin: 20px 0;
            font-family: 'Georgia', serif;
        }
        .timer {
            font-size: 48px;
            font-weight: bold;
            font-family: monospace;
            background: #1e293b;
            color: white;
            padding: 10px 20px;
            border-radius: 60px;
            display: inline-block;
            margin: 10px 0;
        }
        .resultado-card {
            background: #eef2ff;
            padding: 20px;
            border-radius: 30px;
            margin: 20px 0;
        }
        .resultado-card h3 { color: #1e3c72; margin-bottom: 15px; }
        .resultado-valor { font-size: 36px; font-weight: bold; color: #6366f1; }
        .info-sesi { background: #fef9c3; border-radius: 20px; padding: 10px; font-size: 12px; color: #854d0e; }
        .erro-acesso { text-align: center; padding: 50px; background: white; border-radius: 40px; max-width: 500px; margin: 20px auto; }
        .erro-acesso h2 { color: #e53e3e; margin-bottom: 20px; }
    </style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://qmcqffnawtfaenyziwsn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtY3FmZm5hd3RmYWVueXppd3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNTM5NTMsImV4cCI6MjA4OTcyOTk1M30._CjaNoeJeQp-8s8Jt-dk3bJfktdEV97R5LhLnWgYrNc';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const jogoSlug = urlParams.get('jogo_slug');
    const alunoId = urlParams.get('aluno_id');
    const turmaId = urlParams.get('turma_id');
    const escolaId = urlParams.get('escola_id');
    const modoTeste = urlParams.get('modo_teste') === 'true';

    let jogoAtivo = false;
    let jogoId = null;
    let startTime = null;
    let timerInterval = null;
    let mediaStream = null;
    let recognition = null;

    const textoParaLer = "O pequeno Saci Sabido encontrou um mistério na mata. Ele usou sua inteligência para resolver o problema sem usar o cachimbo, apenas com sabedoria e envolvimento.";
    const totalPalavras = textoParaLer.split(' ').length;

    function iniciarGravacao() {
        const btn = document.getElementById('btnIniciarLeitura');
        btn.disabled = true;
        btn.textContent = '🎤 Gravando... Leia em voz alta';
        
        startTime = Date.now();
        
        timerInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('timerDisplay').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }, 1000);
        
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = true;
            recognition.interimResults = false;
            
            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript;
                document.getElementById('transcricao').value = transcript;
                finalizarLeitura(transcript);
            };
            
            recognition.onerror = (event) => {
                console.error('Erro no reconhecimento:', event.error);
                alert('Erro no microfone. Tente novamente.');
                reiniciarJogo();
            };
            
            recognition.start();
        } else {
            alert('Seu navegador não suporta reconhecimento de voz. Use Chrome ou Edge.');
            reiniciarJogo();
        }
    }

    function finalizarLeitura(transcricao) {
        if (timerInterval) clearInterval(timerInterval);
        
        const tempoTotal = Math.floor((Date.now() - startTime) / 1000);
        const palavrasLidas = transcricao.split(' ').length;
        const velocidade = Math.round((palavrasLidas / tempoTotal) * 60);
        
        let precisao = 0;
        const palavrasTexto = textoParaLer.toLowerCase().split(' ');
        const palavrasAluno = transcricao.toLowerCase().split(' ');
        
        let acertos = 0;
        palavrasAluno.forEach(palavra => {
            if (palavrasTexto.includes(palavra)) acertos++;
        });
        precisao = Math.round((acertos / totalPalavras) * 100);
        
        let nivel = '';
        if (velocidade < 80) nivel = '🟡 Em desenvolvimento';
        else if (velocidade < 120) nivel = '🟢 Adequado';
        else nivel = '🔵 Avançado';
        
        document.getElementById('resultadoVelocidade').textContent = `${velocidade} palavras/minuto`;
        document.getElementById('resultadoPrecisao').textContent = `${precisao}% de acertos`;
        document.getElementById('resultadoTempo').textContent = `${tempoTotal} segundos`;
        document.getElementById('resultadoNivel').textContent = nivel;
        document.getElementById('resultadoTranscricao').textContent = transcricao;
        
        document.getElementById('telaLeitura').classList.add('hidden');
        document.getElementById('telaResultado').classList.remove('hidden');
        
        salvarResultado(velocidade, precisao, tempoTotal, nivel, transcricao);
        
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
        }
        if (recognition) recognition.stop();
    }

    async function salvarResultado(ppm, precisao, tempo, nivel, transcricao) {
        if (modoTeste || !alunoId) return;
        
        const dados = {
            aluno_id: alunoId,
            jogo_id: jogoId,
            turma_id: turmaId,
            ppm: ppm,
            nivel_proficiencia: nivel,
            texto_avaliacao: textoParaLer,
            transcricao_aluno: transcricao,
            tempo_segundos: tempo,
            habilidade_bncc: 'EF35LP09',
            tipo_atividade: 'fluencia_leitora'
        };
        
        await supabaseClient.from('resultados').insert([dados]);
    }

    function reiniciarJogo() {
        if (timerInterval) clearInterval(timerInterval);
        if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
        if (recognition) recognition.stop();
        document.getElementById('btnIniciarLeitura').disabled = false;
        document.getElementById('btnIniciarLeitura').textContent = '🎤 INICIAR LEITURA';
        document.getElementById('timerDisplay').textContent = '00:00';
    }

    async function iniciarJogo() {
        jogoAtivo = true;
        document.getElementById('telaInicial').classList.add('hidden');
        document.getElementById('telaLeitura').classList.remove('hidden');
        
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            document.getElementById('btnIniciarLeitura').onclick = iniciarGravacao;
        } catch(err) {
            alert('É necessário permitir o acesso ao microfone para realizar a leitura.');
            reiniciarJogo();
        }
    }

    async function verificarAcesso() {
        if (modoTeste) return true;
        if (!jogoSlug || !turmaId) {
            mostrarErro('❌ Link inválido. Faltam parâmetros.');
            return false;
        }
        
        try {
            const { data: jogo } = await supabaseClient
                .from('jogos')
                .select('id')
                .eq('slug', jogoSlug)
                .single();
            
            if (!jogo) { mostrarErro('❌ Jogo não encontrado.'); return false; }
            jogoId = jogo.id;
            
            const { data: atribuicao } = await supabaseClient
                .from('jogos_turma')
                .select('status, data_inicio, data_fim')
                .eq('turma_id', turmaId)
                .eq('jogo_id', jogoId);
            
            if (!atribuicao || atribuicao.length === 0) {
                mostrarErro('❌ Este jogo não foi atribuído à sua turma.');
                return false;
            }
            
            return true;
        } catch(e) { mostrarErro('Erro ao verificar acesso.'); return false; }
    }

    function mostrarErro(mensagem) {
        document.getElementById('app').innerHTML = `
            <div class="erro-acesso"><h2>⛔ Acesso Negado</h2><p>${mensagem}</p><button onclick="window.history.back()">Voltar</button></div>
        `;
    }

    async function carregarJogo() {
        const acesso = await verificarAcesso();
        if (!acesso && !modoTeste) return;
        
        document.getElementById('app').innerHTML = `
            <div class="container">
                <div id="telaInicial">
                    <h1>📖 Fluência Leitora</h1>
                    <p>Leia o texto em voz alta com clareza</p>
                    <div class="info-sesi">📚 Habilidade: EF35LP09 - Ler com fluência</div>
                    <div class="texto-leitura">${textoParaLer}</div>
                    <button id="btnComecar">🚀 COMEÇAR</button>
                    <div class="mt-2" style="font-size:12px;">${modoTeste ? '🔧 Modo teste' : '✅ Conectado'}</div>
                </div>
                
                <div id="telaLeitura" class="hidden">
                    <h2>🎤 Leia em voz alta</h2>
                    <div class="texto-leitura">${textoParaLer}</div>
                    <div class="timer" id="timerDisplay">00:00</div>
                    <button id="btnIniciarLeitura">🎤 INICIAR LEITURA</button>
                    <button id="btnCancelar" style="background:#ef4444;">❌ CANCELAR</button>
                </div>
                
                <div id="telaResultado" class="hidden">
                    <h2>📊 Resultado da Proficiência</h2>
                    <div class="resultado-card">
                        <h3>⏱️ Velocidade</h3>
                        <div class="resultado-valor" id="resultadoVelocidade">0 palavras/minuto</div>
                        <h3>🎯 Precisão</h3>
                        <div class="resultado-valor" id="resultadoPrecisao">0% de acertos</div>
                        <h3>⏰ Tempo total</h3>
                        <div class="resultado-valor" id="resultadoTempo">0 segundos</div>
                        <h3>📝 Nível</h3>
                        <div class="resultado-valor" id="resultadoNivel">--</div>
                        <h3>📄 O que você disse:</h3>
                        <p id="resultadoTranscricao" style="background:#f1f5f9; padding:10px; border-radius:10px; margin-top:10px;"></p>
                    </div>
                    <button id="btnNovamente">🔄 LER NOVAMENTE</button>
                </div>
            </div>
        `;
        
        document.getElementById('btnComecar').onclick = iniciarJogo;
        document.getElementById('btnCancelar').onclick = () => {
            reiniciarJogo();
            document.getElementById('telaLeitura').classList.add('hidden');
            document.getElementById('telaInicial').classList.remove('hidden');
        };
        document.getElementById('btnNovamente').onclick = () => {
            document.getElementById('telaResultado').classList.add('hidden');
            document.getElementById('telaInicial').classList.remove('hidden');
            reiniciarJogo();
        };
    }
    
    carregarJogo();
</script>
</body>
</html>
